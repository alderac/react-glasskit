name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck package
        run: npm run typecheck

      - name: Test package
        run: npm test

      - name: Build package
        run: npm run build

      - name: Audit CSS fallbacks
        run: npm run audit:css

      - name: Smoke test packed Vite package
        run: npm run smoke:package

      - name: Smoke test packed Next package
        run: npm run smoke:next

      - name: Install demo dependencies
        working-directory: demo
        run: npm ci

      - name: Build demo
        working-directory: demo
        run: npm run build
